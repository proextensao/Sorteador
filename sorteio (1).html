<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteio Made By Camis</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&family=Jost:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--red:#9b2d2b;--cream:#faf5e8;--pink:#eba8a0;--olive:#7a8b23;--gold:#f3c969}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--red);color:var(--cream);font-family:Jost,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;border-bottom:14px solid var(--olive);position:relative}
.fl{position:absolute;bottom:-4vh;width:min(24vw,300px);height:min(24vw,300px);opacity:.95}
.fl.l{left:3vw}.fl.r{right:3vw}
.flores{height:clamp(46px,11vh,120px);width:auto;max-width:80vw;margin-bottom:6px;position:relative;z-index:1}
h1{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(28px,5.2vh,56px);line-height:1.05;margin:0}
h1 em{font-weight:500}
.count{font-size:clamp(14px,2.2vh,22px);letter-spacing:.06em;color:var(--pink);margin:6px 0 clamp(8px,2vh,20px)}
.stage{width:min(48vh,80vw);aspect-ratio:1;border-radius:22px;background:var(--cream);border:6px solid var(--cream);overflow:hidden;display:flex;align-items:center;justify-content:center;color:#7a5c55;position:relative;z-index:1}
.stage img{width:100%;height:100%;object-fit:contain}
.stage.win{border-color:var(--pink);box-shadow:0 0 0 8px #eba8a066,0 0 90px #f3c96988;animation:pop .6s ease-out}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
.parab{font-family:'Dancing Script',cursive;font-size:clamp(22px,4vh,44px);color:var(--pink);margin-top:clamp(6px,1.6vh,16px);min-height:1.3em}
.name{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:clamp(34px,7vh,84px);line-height:1.05;min-height:1.1em;position:relative;z-index:1}
.name.run{opacity:.75}
button{margin-top:clamp(8px,2vh,18px);padding:14px 46px;font:inherit;font-size:clamp(18px,2.8vh,26px);font-weight:600;border:0;border-radius:999px;background:var(--cream);color:var(--red);cursor:pointer;position:relative;z-index:1}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (max-width:700px){.fl{display:none}}
@media (prefers-reduced-motion:reduce){.stage.win{animation:none}}
</style>
</head>

<h1>Sorteio Made by <em>Camis</em></h1>
<div class="count" id="count">Carregando participantes...</div>
<div class="stage" id="stage"><span>Os desenhos aparecem aqui</span></div>
<div class="parab" id="parab"></div>
<div class="name" id="name"></div>
<button id="btn" disabled>Sortear</button>
<canvas id="fx"></canvas>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyATjCFSBdAkU8vwj6iVwuKp_QxWp5MlJvw",
  authDomain: "sorteador-72441.firebaseapp.com",
  projectId: "sorteador-72441",
  storageBucket: "sorteador-72441.firebasestorage.app",
  messagingSenderId: "1025904440518",
  appId: "1:1025904440518:web:b19a0d922466829d8dd3c7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const $ = id => document.getElementById(id);

let lista = [], vencedores = new Set(), rodando = false;

db.collection('participantes').onSnapshot(snap => {
  lista = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const livres = lista.filter(p => !vencedores.has(p.id)).length;
  $('count').textContent = lista.length + (lista.length === 1 ? ' participante' : ' participantes');
  if (!rodando) $('btn').disabled = livres === 0;
}, () => $('count').textContent = 'Erro ao carregar. Confira as regras do Firestore.');

function mostrar(p, win){
  const img = document.createElement('img');
  img.alt = 'Desenho de ' + p.nome; img.src = p.foto;
  $('stage').replaceChildren(img);
  $('stage').classList.toggle('win', !!win);
  const n = $('name'); n.textContent = p.nome; n.classList.toggle('run', !win);
  $('parab').textContent = win ? 'Parabéns!' : '';
}

$('btn').addEventListener('click', () => {
  const livres = lista.filter(p => !vencedores.has(p.id));
  if (!livres.length || rodando) return;
  rodando = true; $('btn').disabled = true;
  const ganhador = livres[Math.floor(Math.random() * livres.length)];
  let passo = 0, total = 30, espera = 70;
  (function tick(){
    if (passo >= total){
      mostrar(ganhador, true); vencedores.add(ganhador.id); confete();
      rodando = false; $('btn').textContent = 'Sortear novamente';
      $('btn').disabled = lista.filter(p => !vencedores.has(p.id)).length === 0;
      return;
    }
    mostrar(livres[Math.floor(Math.random() * livres.length)], false);
    passo++; espera += passo > 18 ? 18 : 0;
    setTimeout(tick, espera);
  })();
});

function confete(){
  const c = $('fx'), x = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const cores = ['#eba8a0','#faf5e8','#d8625a','#a8bd3a','#f3c969','#8d6cc0'];
  const ps = Array.from({length:180}, () => ({
    x: Math.random()*c.width, y: -20 - Math.random()*c.height*.5,
    vx: (Math.random()-.5)*4, vy: 3+Math.random()*5,
    s: 6+Math.random()*8, r: Math.random()*6, cor: cores[Math.floor(Math.random()*cores.length)]
  }));
  let t = 0;
  (function frame(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.r+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.cor; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if (++t < 260) requestAnimationFrame(frame); else x.clearRect(0,0,c.width,c.height);
  })();
}
</script>
